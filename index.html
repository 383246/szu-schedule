<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 深大智能课表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 420px; width: 100%; }
  .logo { font-size: 56px; line-height: 1; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 14px; opacity: .9; line-height: 1.7; margin-bottom: 28px; }
  .enter {
    display: inline-block;
    background: #fff;
    color: #667eea;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 44px;
    border-radius: 50px;
    box-shadow: 0 6px 20px rgba(0,0,0,.2);
    transition: transform .15s, box-shadow .15s;
  }
  .enter:active { transform: scale(.96); box-shadow: 0 3px 10px rgba(0,0,0,.2); }
  .hint { font-size: 12px; opacity: .75; margin-top: 24px; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">📚</div>
    <h1>深大智能课表</h1>
    <p>纯前端课表管理工具<br>支持 .ics 导入、课前提醒、课后笔记、深色模式</p>
    <a class="enter" href="./szu_schedule.html">进入课表 →</a>
    <div class="hint">建议用手机浏览器打开后「添加到主屏幕」，可像 App 一样使用</div>
  </div>
  <script>
    try {
      if (localStorage.getItem('szu_entered')) {
        location.replace('./szu_schedule.html');
      }
    } catch (e) {}
    document.querySelector('.enter').addEventListener('click', function () {
      try { localStorage.setItem('szu_entered', '1'); } catch (e) {}
    });
  </script>
</body>
</html>
